<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Catastro</title>
    
    <!-- 1. LIBRERÍAS (Cambiadas a jsDelivr para evitar errores de CORS en GitHub) -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #mapa { height: 100vh; width: 100%; background: #ffffff; }
    </style>
</head>
<body> 
    <div id="mapa"></div>

    <script type="text/javascript">
        // Esperamos a que el navegador cargue los scripts para usar 'L'
        window.onload = function() {
            
            // 2. INICIALIZAMOS EL MAPA
            var mimapa = L.map('mapa', { 
                preferCanvas: true 
            }).setView([-31.255, -61.49], 14);

            // 3. CAPA BASE IGN
            L.tileLayer('https://ign.gob.ar{z}/{x}/{-y}.png', {
                attribution: 'IGN Argentina',
                maxZoom: 20
            }).addTo(mimapa);

            // 4. LINK DE TU GOOGLE SHEET (CSV)
            const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR818ZjL3LrLFIwrl20srepq4-rhlfYMedQGlt5upQg1y7MlS9DpBbll1wGhGZULMMEqZv_cBvwgsz3/pub?output=csv";

            // 5. CARGAR Y DIBUJAR PUNTOS
            Papa.parse(urlCSV, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    results.data.forEach(function(fila) {
                        let lat = parseFloat(fila.ycoord);
                        let lng = parseFloat(fila.xcoord);
                        
                        if (!isNaN(lat) && !isNaN(lng)) {
                            L.circleMarker([lat, lng], {
                                radius: 2.5,
                                fillColor: "#ff4d00",
                                color: "#ffffff",
                                weight: 0.5,
                                fillOpacity: 0.8
                            })
                            .addTo(mimapa)
                            .bindPopup("<b>Catastro:</b> " + (fila.catastro || "S/D"));
                        }
                    });
                }
            });
        };
    </script>
</body>
</html>
