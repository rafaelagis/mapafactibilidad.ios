<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mapa de Catastro</title>
    
    <!-- 1. CARGA DE LIBRERÍAS (URLs COMPLETAS Y CORRECTAS) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <script src="https://cloudflare.com"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #mapa { height: 100vh; width: 100%; }
    </style>
</head>
<body> 
    <div id="mapa"></div>

    <script>
        // 2. INICIALIZAMOS EL MAPA (Se usa 'L' después de cargar el script arriba)
        var mimapa = L.map('mapa', { preferCanvas: true }).setView([-31.255, -61.49], 14);

        L.tileLayer('https://ign.gob.ar{z}/{x}/{-y}.png', {
            attribution: 'IGN Argentina'
        }).addTo(mimapa);

        // 3. URL DEL CSV DE GOOGLE
        const urlCSV = "https://google.com";

        // 4. PROCESAR PUNTOS
        Papa.parse(urlCSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                console.log("Datos cargados: ", results.data.length);
                results.data.forEach(function(fila) {
                    let lat = parseFloat(fila.ycoord);
                    let lng = parseFloat(fila.xcoord);
                    
                    if (!isNaN(lat) && !isNaN(lng)) {
                        L.circleMarker([lat, lng], { 
                            radius: 2,
                            fillColor: "#ff4500",
                            color: "#000",
                            weight: 0.5,
                            fillOpacity: 0.7
                        })
                        .addTo(mimapa)
                        .bindPopup("Catastro: " + (fila.catastro || "Sin dato"));
                    }
                });
            }
        });
    </script>
</body>
</html>
